<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" fill="none">
  <!-- Kaaka Body / Kurta in vibrant Mustard & Olive -->
  <path d="M120,620 L130,340 C130,280 200,260 260,260 C320,260 390,280 390,340 L400,620 Z" fill="#E8B73A" stroke="#000" stroke-width="8"/>
  <path d="M190,320 L260,420 L330,320" stroke="#8B6B1E" stroke-width="8" fill="none"/>
  <!-- Angavastram / Shawl draped in Tangerine -->
  <path d="M120,380 C150,440 220,540 240,620 L170,620 C150,560 110,480 100,420 Z" fill="#E8541E" stroke="#000" stroke-width="6"/>

  <!-- Head & Neck -->
  <rect x="235" y="220" width="50" height="60" fill="#D9808A" stroke="#000" stroke-width="6"/>
  <ellipse cx="260" cy="180" rx="65" ry="75" fill="#E59037" stroke="#000" stroke-width="8"/>
  
  <!-- Vibhuti / Chandanam tilak on forehead -->
  <line x1="230" y1="125" x2="290" y2="125" stroke="#FFF" stroke-width="4"/>
  <line x1="232" y1="132" x2="288" y2="132" stroke="#FFF" stroke-width="4"/>
  <line x1="235" y1="139" x2="285" y2="139" stroke="#FFF" stroke-width="4"/>
  <circle cx="260" cy="132" r="4" fill="#A71F2B"/>

  <!-- Iconic Pixel-Style "Thug Life" Sunglasses -->
  <g id="pixel-sunglasses">
    <!-- Frame -->
    <rect x="202" y="152" width="116" height="32" rx="2" fill="#000" stroke="#FFF" stroke-width="3"/>
    <rect x="210" y="158" width="44" height="20" fill="#1A0A3A"/>
    <rect x="266" y="158" width="44" height="20" fill="#1A0A3A"/>
    <!-- Pixel white glare squares -->
    <rect x="214" y="162" width="6" height="6" fill="#FFF"/>
    <rect x="222" y="168" width="6" height="6" fill="#FFF"/>
    <rect x="270" y="162" width="6" height="6" fill="#FFF"/>
    <rect x="278" y="168" width="6" height="6" fill="#FFF"/>
    <!-- Arms -->
    <line x1="202" y1="164" x2="185" y2="160" stroke="#000" stroke-width="5"/>
    <line x1="318" y1="164" x2="335" y2="160" stroke="#000" stroke-width="5"/>
  </g>

  <!-- Big South Indian Moustache -->
  <path d="M210,210 C235,235 255,215 260,212 C265,215 285,235 310,210 C325,230 280,248 260,225 C240,248 195,230 210,210 Z" fill="#000"/>

  <!-- Left Arm Raised High Holding Brass Tumbler Pouring Stream -->
  <path d="M130,340 L80,240 L110,130 L160,140" stroke="#E59037" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brass Tumbler -->
  <polygon points="140,110 190,120 180,180 145,175" fill="#E8B73A" stroke="#000" stroke-width="6"/>
  <ellipse cx="165" cy="115" rx="25" ry="8" fill="#8B6B1E"/>

  <!-- The Long Majestic Filter Coffee Stream -->
  <path d="M165,120 C180,220 340,320 375,440" stroke="#8B6B1E" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M165,120 C180,220 340,320 375,440" stroke="#F3EAD2" stroke-width="4" stroke-dasharray="8 12" fill="none"/>

  <!-- Right Hand Low Holding Dabara / Saucer Catching the Coffee -->
  <path d="M370,360 L440,420 L400,470" stroke="#E59037" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brass Dabara -->
  <ellipse cx="380" cy="470" rx="60" ry="22" fill="#E8B73A" stroke="#000" stroke-width="6"/>
  <ellipse cx="380" cy="466" rx="46" ry="14" fill="#8B6B1E"/>
  <!-- Frothy Coffee Bubbles -->
  <circle cx="370" cy="464" r="6" fill="#F3EAD2"/>
  <circle cx="384" cy="466" r="8" fill="#F3EAD2"/>
  <circle cx="395" cy="463" r="5" fill="#F3EAD2"/>
</svg>