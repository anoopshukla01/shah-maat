<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- Center Main Cup -->
  <g transform="translate(190, 20)">
    <!-- Base -->
    <rect x="25" y="190" width="70" height="40" rx="6" fill="#24170D" stroke="#CC771E" stroke-width="3"/>
    <rect x="35" y="160" width="50" height="30" fill="#773E04"/>
    <!-- Stem & Cup -->
    <path d="M15,50 C15,140 105,140 105,50 Z" fill="#E59037" stroke="#FFFAF4" stroke-width="4"/>
    <!-- Handles -->
    <path d="M15,60 C-15,60 -15,110 25,120" stroke="#FFFAF4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M105,60 C135,60 135,110 95,120" stroke="#FFFAF4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Knight emblem on cup -->
    <circle cx="60" cy="85" r="20" fill="#FFFAF4"/>
    <path d="M52,95 L68,95 L65,75 C62,70 55,70 52,75 Z" fill="#522C05"/>
  </g>

  <!-- Left Rosette Medal -->
  <g transform="translate(60, 60)">
    <circle cx="50" cy="70" r="40" fill="#B35E05" stroke="#FFFAF4" stroke-width="4"/>
    <circle cx="50" cy="70" r="28" fill="#F5C38F"/>
    <text x="50" y="78" text-anchor="middle" fill="#522C05" font-family="sans-serif" font-size="20" font-weight="900">1st</text>
    <!-- Ribbons -->
    <polygon points="35,105 20,165 45,150" fill="#C23B22"/>
    <polygon points="65,105 80,165 55,150" fill="#C23B22"/>
  </g>

  <!-- Right Wooden Shield Trophy -->
  <g transform="translate(350, 50)">
    <path d="M20,30 L80,30 L80,110 C80,150 50,170 50,170 C50,170 20,150 20,110 Z" fill="#773E04" stroke="#FFFAF4" stroke-width="4"/>
    <path d="M30,42 L70,42 L70,105 C70,135 50,150 50,150 C50,150 30,135 30,105 Z" fill="#CC771E"/>
    <polygon points="50,65 55,78 70,80 58,90 62,105 50,96 38,105 42,90 30,80 45,78" fill="#FFFAF4"/>
  </g>
</svg>