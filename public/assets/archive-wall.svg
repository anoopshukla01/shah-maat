<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Sepia corkboard / wood wall -->
  <rect x="10" y="10" width="780" height="430" rx="16" fill="#8B5A2B" stroke="#522C05" stroke-width="8"/>
  <rect x="22" y="22" width="756" height="406" rx="10" fill="#954E05" opacity="0.4"/>
  
  <!-- Polaroid 1: 1st Inter-College Meet -->
  <g transform="translate(60, 50) rotate(-4)">
    <rect x="0" y="0" width="160" height="200" fill="#FFFAF4" stroke="#522C05" stroke-width="3" rx="4"/>
    <rect x="12" y="12" width="136" height="136" fill="#705B49"/>
    <!-- Miniature Chess pieces sketch in photo -->
    <circle cx="80" cy="70" r="28" fill="#F5C38F"/>
    <polygon points="68,60 80,45 92,60" fill="#522C05"/>
    <text x="80" y="180" text-anchor="middle" fill="#522C05" font-family="sans-serif" font-size="12" font-weight="bold">First Rapid Arena '22</text>
    <!-- Pushpin -->
    <circle cx="80" cy="6" r="6" fill="#C23B22" stroke="#FFFAF4" stroke-width="2"/>
  </g>

  <!-- Pinned Scoresheet -->
  <g transform="translate(270, 40) rotate(2)">
    <rect x="0" y="0" width="220" height="280" fill="#FDEBD8" stroke="#705B49" stroke-width="2" rx="4"/>
    <line x1="20" y1="40" x2="200" y2="40" stroke="#CC771E" stroke-width="2"/>
    <text x="30" y="30" fill="#773E04" font-family="monospace" font-size="12" font-weight="bold">OFFICIAL SCORESHEET</text>
    <text x="30" y="65" fill="#522C05" font-family="'Special Elite', monospace" font-size="12">1. e4 e5  2. Nf3 Nc6</text>
    <text x="30" y="90" fill="#522C05" font-family="'Special Elite', monospace" font-size="12">3. Bc4 Bc5 4. b4! Bxb4</text>
    <text x="30" y="115" fill="#522C05" font-family="'Special Elite', monospace" font-size="12">5. c3 Ba5 6. d4 exd4</text>
    <text x="30" y="145" fill="#B35E05" font-family="'Special Elite', monospace" font-size="13" font-weight="bold">EVANS GAMBIT — WON 1-0</text>
    <circle cx="110" cy="8" r="6" fill="#B35E05" stroke="#FFFAF4" stroke-width="2"/>
  </g>

  <!-- Brass Tenure Plaque -->
  <g transform="translate(530, 80) rotate(-2)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#24170D" stroke="#CC771E" stroke-width="6"/>
    <rect x="10" y="10" width="190" height="130" fill="#CC771E"/>
    <rect x="14" y="14" width="182" height="122" fill="#773E04"/>
    <text x="105" y="45" text-anchor="middle" fill="#FFFAF4" font-family="serif" font-size="15" font-weight="bold">FOUNDING COUNCIL</text>
    <text x="105" y="70" text-anchor="middle" fill="#F9D7B4" font-family="sans-serif" font-size="11">ESTABLISHED 2022</text>
    <text x="105" y="95" text-anchor="middle" fill="#FFFAF4" font-family="serif" font-size="12" font-style="italic">IIT Madras BS Degree</text>
    <circle cx="25" cy="25" r="4" fill="#F5C38F"/>
    <circle cx="185" cy="25" r="4" fill="#F5C38F"/>
    <circle cx="25" cy="125" r="4" fill="#F5C38F"/>
    <circle cx="185" cy="125" r="4" fill="#F5C38F"/>
  </g>
</svg>