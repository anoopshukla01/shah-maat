<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" stroke="#E59037" stroke-opacity="0.22">
  <g transform="translate(400,400)">
    <!-- Concentric rings -->
    <circle r="360" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="300" stroke-width="2"/>
    <circle r="240" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="180" stroke-width="2"/>
    <circle r="120" stroke-width="2"/>
    <circle r="60" stroke-width="1.5"/>
    <circle r="8" fill="#E59037" fill-opacity="0.4"/>
    <!-- 8-fold symmetric lotus petals -->
    <g id="petals">
      <path d="M0 -300 C-60 -210 -60 -90 0 0 C60 -90 60 -210 0 -300" stroke-width="1.8"/>
      <path d="M0 -300 C-30 -220 -30 -100 0 0 C30 -100 30 -220 0 -300" stroke-width="1.2"/>
      <circle cx="0" cy="-240" r="6" fill="#CC771E" fill-opacity="0.3"/>
    </g>
    <use href="#petals" transform="rotate(45)"/>
    <use href="#petals" transform="rotate(90)"/>
    <use href="#petals" transform="rotate(135)"/>
    <use href="#petals" transform="rotate(180)"/>
    <use href="#petals" transform="rotate(225)"/>
    <use href="#petals" transform="rotate(270)"/>
    <use href="#petals" transform="rotate(315)"/>
    <!-- Curved grid intersections -->
    <path d="M-240 -240 Q0 -180 240 -240 Q180 0 240 240 Q0 180 -240 240 Q-180 0 -240 -240" stroke-width="1.5"/>
    <path d="M-180 0 L180 0 M0 -180 L0 180" stroke-width="1"/>
  </g>
</svg>